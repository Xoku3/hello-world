<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek UI Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .card-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-value {
            font-size: 2em;
            font-weight: bold;
        }

        .button-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.5);
        }

        .btn-warning {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(67, 233, 123, 0.5);
        }

        .output-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            min-height: 100px;
            margin-bottom: 20px;
        }

        .output-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .output-content {
            color: #555;
            line-height: 1.6;
            font-size: 1em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-field {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 1s ease-in-out;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: rotate(180deg);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    
    <div class="container">
        <h1>Sleek Dashboard</h1>
        <p class="subtitle">A modern, interactive UI experience</p>

        <div class="card-grid">
            <div class="card" onclick="incrementCounter('views')">
                <div class="card-icon">👁️</div>
                <div class="card-title">Views</div>
                <div class="card-value" id="viewsCount">0</div>
            </div>
            <div class="card" onclick="incrementCounter('clicks')">
                <div class="card-icon">👆</div>
                <div class="card-title">Clicks</div>
                <div class="card-value" id="clicksCount">0</div>
            </div>
            <div class="card" onclick="incrementCounter('likes')">
                <div class="card-icon">❤️</div>
                <div class="card-title">Likes</div>
                <div class="card-value" id="likesCount">0</div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" class="input-field" id="userInput" placeholder="Enter your message here...">
            <button class="btn btn-primary" onclick="processInput()">Submit</button>
        </div>

        <div class="button-section">
            <button class="btn btn-primary" onclick="showGreeting()">Show Greeting</button>
            <button class="btn btn-secondary" onclick="showTime()">Current Time</button>
            <button class="btn btn-success" onclick="generateRandom()">Random Number</button>
            <button class="btn btn-warning" onclick="resetCounters()">Reset All</button>
        </div>

        <div class="output-section">
            <div class="output-title">Output</div>
            <div class="output-content" id="output">Click any button to see the magic happen! ✨</div>
        </div>
    </div>

    <script>
        let counters = {
            views: 0,
            clicks: 0,
            likes: 0
        };

        function incrementCounter(type) {
            counters[type]++;
            document.getElementById(type + 'Count').textContent = counters[type];
            document.getElementById(type + 'Count').classList.add('pulse');
            setTimeout(() => {
                document.getElementById(type + 'Count').classList.remove('pulse');
            }, 1000);
            updateOutput(`${type.charAt(0).toUpperCase() + type.slice(1)} count increased to ${counters[type]}! 🎉`);
        }

        function showGreeting() {
            const hour = new Date().getHours();
            let greeting;
            if (hour < 12) greeting = "Good Morning! ☀️";
            else if (hour < 18) greeting = "Good Afternoon! 🌤️";
            else greeting = "Good Evening! 🌙";
            updateOutput(greeting + " Welcome to this sleek UI dashboard!");
        }

        function showTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            const dateString = now.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            updateOutput(`⏰ Current Time: ${timeString}<br>📅 Date: ${dateString}`);
        }

        function generateRandom() {
            const random = Math.floor(Math.random() * 1000) + 1;
            updateOutput(`🎲 Your random number is: <strong>${random}</strong>`);
        }

        function resetCounters() {
            counters = { views: 0, clicks: 0, likes: 0 };
            document.getElementById('viewsCount').textContent = '0';
            document.getElementById('clicksCount').textContent = '0';
            document.getElementById('likesCount').textContent = '0';
            updateOutput('All counters have been reset to zero! 🔄');
        }

        function processInput() {
            const input = document.getElementById('userInput').value;
            if (input.trim() === '') {
                updateOutput('Please enter a message first! 📝');
                return;
            }
            updateOutput(`You said: <strong>"${input}"</strong><br>Message length: ${input.length} characters`);
            document.getElementById('userInput').value = '';
        }

        function updateOutput(message) {
            document.getElementById('output').innerHTML = message;
        }

        function toggleTheme() {
            const body = document.body;
            const container = document.querySelector('.container');
            const toggle = document.querySelector('.theme-toggle');
            
            if (body.style.background.includes('667eea')) {
                body.style.background = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
                container.style.background = 'rgba(30, 30, 30, 0.95)';
                container.style.color = '#fff';
                document.querySelector('.subtitle').style.color = '#ccc';
                document.querySelector('.output-section').style.background = '#2a2a2a';
                document.querySelector('.output-title').style.color = '#fff';
                document.querySelector('.output-content').style.color = '#ccc';
                toggle.textContent = '☀️';
            } else {
                body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                container.style.background = 'rgba(255, 255, 255, 0.95)';
                container.style.color = '#333';
                document.querySelector('.subtitle').style.color = '#666';
                document.querySelector('.output-section').style.background = '#f8f9fa';
                document.querySelector('.output-title').style.color = '#333';
                document.querySelector('.output-content').style.color = '#555';
                toggle.textContent = '🌙';
            }
        }

        // Initialize with a welcome message
        window.onload = function() {
            updateOutput('Welcome! 👋 Explore the interactive features of this sleek UI dashboard.');
        };
    </script>
</body>
</html>
